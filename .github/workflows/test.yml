name: test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # README 声称支持 3.9+，必须每个版本都真跑一遍
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13' ]
    name: py${{ matrix.python-version }}
    env:
      # Windows runner 控制台默认 cp1252，脚本输出是中文
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python version
        run: python -c "import sys; print(sys.version)"

      - name: Core self-check (22 asserts + 7 fault-injection)
        run: python core.py --selftest

      - name: End-to-end (55 checks, HKCU sandbox)
        run: python test_e2e.py

      - name: Single-instance guard (cross-process mutex)
        run: python test_single_instance.py

      - name: Real HKLM round-trip (runs only if runner has admin)
        env:
          WU_PAUSE_ALLOW_HKLM_TEST: '1'
        run: python test_hklm.py

  gui:
    # 单独一个 job：只装 README 里写的那两条依赖，验证用户照着做能不能跑起来
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GUI dependencies (exactly as documented in README)
        run: pip install PySide6 PySide6-Fluent-Widgets

      - name: GUI smoke test (offscreen)
        run: python test_gui.py
